# stock-db 服务已迁移说明（2026-10-07）

本项目的 PostgreSQL（pgvector，服务名 `stock-db`，容器 `vpc-stock-db`）已迁入
全机器共享的中间件基建 **`$HOME/infrastructure/middleware/dev`**（compose 项目名 `dev-middleware`）。

- 容器：`dev-middleware-stock-db`，镜像 `pgvector/pgvector:pg16`
- 连接信息保持不变：`postgresql://postgres:postgres@127.0.0.1:15433/stock`
  （代码默认 DSN 与 `VPC_DB_DSN` 环境变量均无需改动）
- 容器网络内（dev-middleware_data-platform）：`stock-db:5432`
- 原数据卷 `video-provider-and-crawler_stock-db-data` 已迁入
  `dev-middleware_stock_db_data`，旧卷保留为备份，确认无误后可删除。

启动共享基建：

```bash
cd $HOME/infrastructure/middleware/dev
docker compose --env-file .env -f compose.yaml up -d stock-db
```
